# RIFT OTel Collector Configuration
# File: docker/otel-collector-config.yaml
#
# Data path:
#   Online Boutique → OTLP gRPC (port 4317) → OTel Collector
#   OTel Collector → Prometheus text (port 8889) → Prometheus → PrometheusClient → RIFT
#
# Status: IMPLEMENTED / MAC_TESTABLE / READY_FOR_LINUX
# Authority: docs/telemetry/LIVE_DATA_PATH.md

receivers:
  # Receive OTLP from boutique services (gRPC and HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Internal prometheus scraper for services that expose Prometheus natively
  # (cadvisor for container resource metrics)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'cadvisor'
          scrape_interval: 15s
          static_configs:
            - targets: ['cadvisor:8080']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  resource:
    attributes:
      - key: environment
        value: rift-eval
        action: insert

exporters:
  # Expose aggregated metrics as Prometheus endpoint on port 8889
  # Prometheus is configured to scrape this endpoint (prometheus.yml)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: boutique
    resource_to_telemetry_conversion:
      enabled: true   # promotes resource attributes (service.name) to metric labels

  # Forward traces to Jaeger via OTLP
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  logging:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    # Traces: boutique OTLP → Jaeger
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/jaeger]

    # Metrics: boutique OTLP + cadvisor → Prometheus exporter
    # Both OTLP (gRPC from boutique) and prometheus (cadvisor) feed metrics.
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [prometheus]
