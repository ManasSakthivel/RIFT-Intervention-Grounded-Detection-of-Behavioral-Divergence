# RIFT Configuration — Live
# Phase 3.6 §25
# Use for: live Linux testbed execution with real Online Boutique
# Requires: Linux + Docker + Prometheus + Jaeger + CAP_NET_ADMIN

config_id: "live"
description: "Live testbed configuration — requires Linux"
dataset_split: "development"
dry_run: false
seed: 42

telemetry:
  source: "prometheus"
  prometheus_url: "http://localhost:9090"
  jaeger_url: "http://localhost:16686"
  scrape_interval_s: 15.0
  delta_t_s: 10.0
  max_forward_fill_windows: 1

anomaly_detection:
  theta_detect: 3.0
  theta_persist: 2

causal_discovery:
  fci_alpha: 0.05
  max_variables: 15
  ci_test: "fisherz"

cid:
  n_permutations: 10000
  n_bootstrap: 1000
  alpha: 0.05
  n_min_insufficient: 20
  n_min_candidate: 50

ebd:
  theta_cid: 0.1

cost_model:
  w_br: 0.25
  w_slai: 0.25
  w_rc: 0.25
  w_sc: 0.25
  t_budget_s: 600.0

closed_loop:
  theta_stop_entropy: 0.5
  max_iterations: 10

safety:
  approved_namespaces:
    - "rift-eval-default"
    - "rift-eval-dev"
    - "rift-eval-val"
  max_blast_radius: 0.30
  max_sla_impact: 0.05
  autonomous_br_threshold: 0.10
  autonomous_slai_threshold: 0.01
  cascade_error_threshold: 0.50
  cascade_duration_threshold_s: 30.0

network_intervention:
  backend: "linux_tc_netem"      # requires Linux+CAP_NET_ADMIN
  interface: "eth0"
  namespace: "rift-eval-default"

linux_requirements:
  - "Linux kernel >= 4.19"
  - "tc (iproute2)"
  - "CAP_NET_ADMIN"
  - "Docker Engine >= 24"
  - "kubectl >= 1.27"

logging:
  level: "INFO"
  provenance: true
  artifact_dir: "results"
