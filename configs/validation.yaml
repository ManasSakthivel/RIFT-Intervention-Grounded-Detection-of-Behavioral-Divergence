# RIFT Configuration — Validation
# Phase 3.6 §25
# Use for: validation set evaluation (18 scenarios)
# Dataset: validation split — NOT held-out test
# NEVER use held-out test split with this config

config_id: "validation"
description: "Validation configuration for intermediate evaluation"
dataset_split: "validation"
dry_run: true
seed: 42

telemetry:
  source: "mock"
  prometheus_url: null
  scrape_interval_s: 15.0
  delta_t_s: 10.0
  max_forward_fill_windows: 1

anomaly_detection:
  theta_detect: 3.0
  theta_persist: 2

causal_discovery:
  fci_alpha: 0.05
  max_variables: 15
  ci_test: "fisherz"

cid:
  n_permutations: 10000
  n_bootstrap: 1000
  alpha: 0.05
  n_min_insufficient: 20
  n_min_candidate: 50

ebd:
  theta_cid: 0.1

cost_model:
  w_br: 0.25
  w_slai: 0.25
  w_rc: 0.25
  w_sc: 0.25
  t_budget_s: 600.0

closed_loop:
  theta_stop_entropy: 0.5
  max_iterations: 10
  alpha_confirm: 0.2
  alpha_weaken: 0.1

safety:
  approved_namespaces:
    - "rift-eval-default"
    - "rift-eval-val"
  max_blast_radius: 0.30
  max_sla_impact: 0.05

evaluation:
  metrics:
    - "precision_at_1"
    - "conditional_precision_at_1"
    - "abstention_rate"
  power_target: 0.80
  alpha: 0.05

logging:
  level: "INFO"
  provenance: true
  artifact_dir: "results"
