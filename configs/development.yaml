# RIFT Configuration — Development
# Phase 3.6 §25
# Use for: tuning, development experiments, unit tests
# Dataset: development split (36 scenarios)
# NEVER use held-out test split with this config

config_id: "development"
description: "Development configuration for tuning and iteration"
dataset_split: "development"
dry_run: true
seed: 42

telemetry:
  source: "mock"                 # mock | prometheus
  prometheus_url: null           # set when live
  scrape_interval_s: 15.0
  delta_t_s: 10.0
  max_forward_fill_windows: 1

anomaly_detection:
  theta_detect: 3.0              # z-score threshold
  theta_persist: 2               # minimum consecutive windows

causal_discovery:
  fci_alpha: 0.05
  max_variables: 15              # k≤15 per SPEC_FREEZE §3
  ci_test: "fisherz"

cid:
  n_permutations: 10000
  n_bootstrap: 1000
  alpha: 0.05
  n_min_insufficient: 20         # SPEC_FREEZE SPEC-AMEND-003
  n_min_candidate: 50

ebd:
  theta_cid: 0.1                 # IQR-normalized threshold multiplier

cost_model:
  w_br: 0.25
  w_slai: 0.25
  w_rc: 0.25
  w_sc: 0.25
  t_budget_s: 600.0

closed_loop:
  theta_stop_entropy: 0.5
  max_iterations: 10
  alpha_confirm: 0.2
  alpha_weaken: 0.1

safety:
  approved_namespaces:
    - "rift-eval-default"
    - "rift-eval-dev"
  max_blast_radius: 0.30
  max_sla_impact: 0.05
  autonomous_br_threshold: 0.10
  autonomous_slai_threshold: 0.01
  cascade_error_threshold: 0.50
  cascade_duration_threshold_s: 30.0

evaluation:
  metrics:
    - "precision_at_1"
    - "conditional_precision_at_1"
    - "coverage"
    - "abstention_rate"
    - "detection_latency_s"
  power_target: 0.80
  alpha: 0.05

logging:
  level: "INFO"
  provenance: true
  artifact_dir: "results"
