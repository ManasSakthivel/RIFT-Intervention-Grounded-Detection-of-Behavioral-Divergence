name: RIFT Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q --tb=short
          # Expected: 624 passed, 0 failed

      - name: Lint — forbidden causal-claim phrases
        run: |
          make lint
        continue-on-error: true

      - name: Security scan — no secrets in source
        run: |
          ! grep -rn "IBM!123\|private_key\|api_key\s*=\s*['\"][^'\"]\|-----BEGIN" \
            src/ configs/ tests/ || (echo "SECRET DETECTED — failing" && exit 1)
