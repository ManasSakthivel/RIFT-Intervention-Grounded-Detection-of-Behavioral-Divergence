name: RIFT Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Final execution (Agent 5): requirements.txt now pins exactly reproducibility/requirements-canonical-py39.lock.txt
      # (causal-learn 0.1.4.8 etc.), so CI runs the stack that produced the committed dev/val results.
      # This step regenerates the V3 dev/val records (dev+val only; scratch dir outside artifacts/) and FAILS if
      # any record differs from artifacts/sprint4_4_0/v3_{dev,val}.json. It executes the pipeline; it is not an import check.
      - name: Reproduce committed V3 dev/val records
        run: |
          python scripts/final_repro_check.py "$RUNNER_TEMP/repro" --report repro_report.json

      - name: Upload reproduction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-report
          path: repro_report.json
          if-no-files-found: ignore

      # Sprint 4.4.2 reproducibility-aware harness. Two committed tests verify integrity of protected
      # materials that are deliberately NOT in git (sealed held-out candidate; historical Stage 4 artifact).
      # On a clean checkout they are reported as PROTECTED-MATERIAL-UNAVAILABLE (integrity NOT verified) --
      # never as passed, never silently skipped. Any other failure, including a protected test that runs and
      # fails, exits non-zero. Owner-run verification with materials present: --require-protected.
      - name: Run full test suite (reproducibility-aware)
        run: |
          python scripts/sprint442_run_tests.py tests --tb=short --json test_classification.json

      - name: Publish test classification
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("test_classification.json"):
              print("## RIFT test classification\n\nNo classification produced (test run aborted).")
          else:
              d = json.load(open("test_classification.json"))
              print("## RIFT test classification")
              for k in ("REPRODUCIBLE_PASS", "PROTECTED_PASS", "PROTECTED_UNAVAILABLE", "SKIPPED_OTHER", "FAILED"):
                  print(f"- **{k}**: {len(d.get(k, []))}")
              for k in ("PROTECTED_UNAVAILABLE", "FAILED", "SKIPPED_OTHER"):
                  if d.get(k):
                      print(f"\n### {k}")
                      for n in d[k]:
                          print(f"- `{n}`")
              if d.get("PROTECTED_UNAVAILABLE"):
                  print("\n> Protected-material integrity was **NOT verified** in CI. This is not a pass.")
          EOF

      - name: Upload test classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-classification
          path: test_classification.json
          if-no-files-found: ignore

      - name: Lint — forbidden causal-claim phrases
        run: |
          make lint
        continue-on-error: true

      - name: Security scan — no secrets in source
        run: |
          ! grep -rn "IBM!123\|private_key\|api_key\s*=\s*['\"][^'\"]\|-----BEGIN" \
            src/ configs/ tests/ || (echo "SECRET DETECTED — failing" && exit 1)
