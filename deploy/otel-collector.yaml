# OpenTelemetry Collector Configuration for RIFT Online Boutique Telemetry Bridge
# Translates microservice gRPC spans and metrics into Prometheus scrapeable format.
# Authority: docs/SPRINT4_1_1_INDEPENDENT_PLAN_AUDIT.md Finding F-03.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 2500ms, 5000ms]
    dimensions:
      - name: http.status_code
      - name: rpc.grpc.status_code
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "rift"
    send_timestamps: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: "info"
    metrics:
      address: "0.0.0.0:8888"
