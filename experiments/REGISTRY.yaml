  # ---------------------------------------------------------------------------
  # EXP-013: H3 — Closed-loop model update necessity
  # Referenced in hypotheses.md H3 and Phase 3.6 spec but was missing from registry
  # ---------------------------------------------------------------------------
  EXP-013:
    description: "Ablation: closed-loop update vs one-shot intervention (H3)"
    rq: ["RQ2"]
    hypotheses: ["H3"]
    input: "datasets/rift_faults/development.json"
    split: "DEVELOPMENT"
    method: "RIFT-FULL"
    baselines: ["RIFT-ONE-SHOT"]
    metrics:
      - precision_at_1
      - n_interventions_to_attribution
      - detection_latency_s
    statistical_test: "wilcoxon_one_sided"
    seed: 42
    n_scenarios: 36
    n_multi_cause_required: 12
    filter: "multi_cause_or_ambiguous"
    filter_note: >
      Filter includes: fault_type=MULTI_CAUSE and fault_type=AMBIGUOUS_ATTRIBUTION.
      Development set contains MC_01..MC_12 (12 multi-cause) + AA_01..AA_03 (3 ambiguous).
      n=15 multi_cause_or_ambiguous scenarios available for Wilcoxon test.
    status: "READY_FOR_LINUX"
    output_artifact: "results/EXP-013/"
    notes: >
      RIFT-ONE-SHOT = RIFT-FULL with closed-loop posterior update disabled.
      Tests whether iterative Bayesian update provides benefit over one-shot
      selection. H3: RIFT-FULL-CLOSED-LOOP > RIFT-ONE-SHOT on multi-cause faults.
      RIFT-ONE-SHOT implementation: src/rift/baselines/rift_one_shot.py (IMPLEMENTED).
      Power at n=15: achieved power ≈ 64% (Wilcoxon, δ=0.30, α=0.05, one-sided).
      P0-01 resolved: RIFT-ONE-SHOT is implemented and MAC_TESTED.
      P0-02 resolved: n=15 multi-cause/ambiguous scenarios in development set.

  # ---------------------------------------------------------------------------
  # EXP-014: H4 cost model effectiveness
  # Referenced in hypotheses.md H4 and Phase 3.6 spec but was missing from registry
  # ---------------------------------------------------------------------------
  EXP-014:
    description: "Cost model effectiveness: MSIS selection vs random (H4)"
    rq: ["RQ6"]
    hypotheses: ["H4"]
    input: "datasets/rift_faults/development.json"
    split: "DEVELOPMENT"
    method: "RIFT-FULL"
    baselines: ["RIFT-RANDOM"]
    metrics:
      - total_ed_s
      - precision_at_1
      - n_interventions
    statistical_tests:
      cost: "wilcoxon_one_sided"
      accuracy: "tost_equivalence"
    seed: 42
    n_scenarios: 36
    status: "READY_FOR_LINUX"
    output_artifact: "results/EXP-014/"
    notes: >
      H4 uses two tests: TOST equivalence for accuracy (H0: not equivalent),
      and one-sided Wilcoxon for cost (H0: RIFT cost >= random cost).
      Both tests applied jointly with Holm-Bonferroni correction.
      Sage+Chaos: DEFERRED_TO_PHASE_8 — do not fabricate results.
      P1-09 resolved: statistical_tests now uses standard map structure.
      RIFT-RANDOM uses real intervention dispatch (P0-04 resolved).
