# RIFT Experiment Registry
# Phase 4.5 — Audited and Completed
# Authority: Phase 3.6 specification §18, docs/hypotheses.md H1–H5
#
# Every experiment has: ID, RQ, hypothesis, input, split, method, baselines,
# metrics, seed, statistical test, output artifact.
#
# Status values:
#   PLANNED          — not yet scheduled
#   READY_FOR_LINUX  — fully specified; awaits Linux testbed
#   PENDING_LINUX    — requires live Online Boutique
#   DRY_RUN_READY    — can run on macOS in synthetic mode
#   COMPLETE         — all runs collected and archived
#   DEFERRED         — deferred to a future phase

metadata:
  version: "4.5"
  last_updated: "2024"
  total_experiments: 14
  frozen_historical:
    raw_v1: 0.50
    conditional_v1: 0.60
    source: "artifacts/phase3_5/v1_decomposition.json"
  note: >
    EXP-001 through EXP-012 are carried forward from Phase 3.6.
    EXP-013 and EXP-014 are added for H3 and H4 (previously referenced in
    hypotheses.md but missing from registry).

experiments:

  EXP-001:
    description: "Causal attribution on synthetic fault scenarios (dev split)"
    rq: ["RQ1", "RQ2"]
    hypotheses: ["H1", "H2"]
    input: "datasets/rift_faults/development.json"
    split: "DEVELOPMENT"
    method: "RIFT-FULL"
    baselines: ["RIFT-OBS", "RIFT-RANDOM", "SIEVE-LIKE", "ORACLE-UPPER-BOUND"]
    metrics:
      - precision_at_1
      - conditional_precision_at_1
      - coverage
      - abstention_rate
      - false_attribution_rate
      - correct_attribution_rate
      - mean_detection_latency_s
    statistical_test: "wilcoxon_one_sided"
    seed: 42
    n_scenarios: 50
    status: "READY_FOR_LINUX"
    output_artifact: "results/EXP-001/"
    notes: >
      Primary causal attribution experiment. PENDING_LINUX for live run.
      Development set expanded to 50 scenarios (P0-02 fix: +11 MULTI_CAUSE, +3 AMBIGUOUS_ATTRIBUTION).

  EXP-002:
    description: "Identifiability-conditioned attribution on confounded scenarios"
    rq: ["RQ2"]
    hypotheses: ["H2"]
    input: "datasets/rift_faults/development.json"
    split: "DEVELOPMENT"
    method: "RIFT-FULL"
    baselines: ["RIFT-OBS", "SIEVE-LIKE"]
    confounded_only: true
    metrics:
      - conditional_precision_at_1
      - correct_abstention_rate
      - not_identifiable_rate
    statistical_test: "wilcoxon_one_sided"
    seed: 42
    n_scenarios: 50
    n_confounded: 24
    n_confounded_required: 48
    n_confounded_across_all_splits: 48
    status: "READY_FOR_LINUX"
    output_artifact: "results/EXP-002/"
    notes: >
      H2 requires n>=48 confounded scenarios for 80% power.
      Development set has 24 confounded; validation set has 24 confounded.
      For H2, both development + validation confounded scenarios are used (n=48 total).
      This is pre-registered: development + validation confounded for H2 power analysis.
      P0-03: 48 total confounded scenarios confirmed across splits; 80% power target met.

