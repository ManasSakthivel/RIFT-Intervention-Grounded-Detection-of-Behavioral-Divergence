<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="700" height="480" fill="#ffffff"/>

  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Online Boutique Testbed Topology</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#57606a">14 containerised microservices on isolated Docker bridge network</text>

  <!-- Helper macro: box(cx, cy, label, sublabel, color, border) -->

  <!-- Load Generator -->
  <rect x="290" y="65" width="120" height="40" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="350" y="83" text-anchor="middle" font-size="11" fill="#57606a">loadgenerator</text>
  <text x="350" y="97" text-anchor="middle" font-size="9" fill="#57606a">Locust ~10 users</text>
  <line x1="350" y1="105" x2="350" y2="123" stroke="#57606a" stroke-width="1.5" marker-end="url(#ta)"/>

  <!-- Frontend -->
  <rect x="270" y="124" width="160" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="2"/>
  <text x="350" y="142" text-anchor="middle" font-size="12" fill="#1f2328" font-weight="500">frontend</text>
  <text x="350" y="156" text-anchor="middle" font-size="9" fill="#57606a">:8080</text>

  <!-- Frontend fans to 6 services -->
  <!-- checkout -->
  <line x1="310" y1="164" x2="180" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <!-- recommendation -->
  <line x1="330" y1="164" x2="270" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <!-- product catalog -->
  <line x1="350" y1="164" x2="350" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <!-- cart -->
  <line x1="370" y1="164" x2="430" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <!-- currency -->
  <line x1="385" y1="164" x2="520" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <!-- ad -->
  <line x1="395" y1="164" x2="610" y2="214" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>

  <!-- Row 2: 6 services -->
  <!-- checkout -->
  <rect x="110" y="215" width="120" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="170" y="233" text-anchor="middle" font-size="11" fill="#1f2328">checkoutservice</text>
  <text x="170" y="247" text-anchor="middle" font-size="9" fill="#57606a">:5050</text>

  <!-- recommendation -->
  <rect x="200" y="215" width="120" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="260" y="233" text-anchor="middle" font-size="11" fill="#1f2328">recommendation</text>
  <text x="260" y="247" text-anchor="middle" font-size="9" fill="#57606a">:8080</text>

  <!-- product catalog -->
  <rect x="290" y="215" width="120" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="350" y="233" text-anchor="middle" font-size="11" fill="#1f2328">productcatalog</text>
  <text x="350" y="247" text-anchor="middle" font-size="9" fill="#57606a">:3550</text>

  <!-- cart -->
  <rect x="380" y="215" width="100" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="430" y="233" text-anchor="middle" font-size="11" fill="#1f2328">cartservice</text>
  <text x="430" y="247" text-anchor="middle" font-size="9" fill="#57606a">:7070</text>

  <!-- currency -->
  <rect x="470" y="215" width="100" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="520" y="233" text-anchor="middle" font-size="11" fill="#1f2328">currency</text>
  <text x="520" y="247" text-anchor="middle" font-size="9" fill="#57606a">:7000</text>

  <!-- ad -->
  <rect x="560" y="215" width="100" height="40" rx="5" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="610" y="233" text-anchor="middle" font-size="11" fill="#1f2328">adservice</text>
  <text x="610" y="247" text-anchor="middle" font-size="9" fill="#57606a">:9555</text>

  <!-- checkout → payment, shipping, email -->
  <line x1="150" y1="255" x2="115" y2="305" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <line x1="170" y1="255" x2="200" y2="305" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>
  <line x1="190" y1="255" x2="285" y2="305" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>

  <!-- recommendation → productcatalog (already above) -->
  <line x1="280" y1="255" x2="340" y2="305" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)" stroke-dasharray="4 2"/>
  <text x="300" y="285" font-size="8" fill="#57606a" font-style="italic">also calls</text>

  <!-- cart → redis -->
  <line x1="430" y1="255" x2="430" y2="305" stroke="#3b82d4" stroke-width="1.2" marker-end="url(#ta)"/>

  <!-- Row 3 -->
  <!-- payment -->
  <rect x="50" y="306" width="110" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="105" y="324" text-anchor="middle" font-size="11" fill="#1f2328">paymentservice</text>
  <text x="105" y="338" text-anchor="middle" font-size="9" fill="#dc2626">:50051 (leaf)</text>

  <!-- shipping -->
  <rect x="165" y="306" width="110" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="220" y="324" text-anchor="middle" font-size="11" fill="#1f2328">shippingservice</text>
  <text x="220" y="338" text-anchor="middle" font-size="9" fill="#dc2626">:50051 (leaf)</text>

  <!-- email -->
  <rect x="280" y="306" width="110" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="335" y="324" text-anchor="middle" font-size="11" fill="#1f2328">emailservice</text>
  <text x="335" y="338" text-anchor="middle" font-size="9" fill="#dc2626">:8080 (leaf)</text>

  <!-- redis -->
  <rect x="375" y="306" width="110" height="40" rx="5" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="324" text-anchor="middle" font-size="11" fill="#1f2328">redis</text>
  <text x="430" y="338" text-anchor="middle" font-size="9" fill="#d97706">:6379 (shared)</text>

  <!-- Observability row -->
  <rect x="38" y="390" width="624" height="60" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="350" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#57606a">Observability Stack</text>

  <rect x="55" y="418" width="110" height="24" rx="4" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1"/>
  <text x="110" y="434" text-anchor="middle" font-size="10" fill="#1f2328">Prometheus :9090</text>

  <rect x="185" y="418" width="130" height="24" rx="4" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1"/>
  <text x="250" y="434" text-anchor="middle" font-size="10" fill="#1f2328">Jaeger :16686</text>

  <rect x="335" y="418" width="160" height="24" rx="4" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1"/>
  <text x="415" y="434" text-anchor="middle" font-size="10" fill="#1f2328">OTel Collector :4317/4318</text>

  <rect x="515" y="418" width="130" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="434" text-anchor="middle" font-size="10" fill="#1f2328">tc/netem (CAP_NET_ADMIN)</text>

  <!-- Legend -->
  <rect x="50" y="458" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="68" y="469" font-size="9" fill="#57606a">Leaf node (R3 limitation)</text>
  <rect x="200" y="458" width="12" height="12" rx="2" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/>
  <text x="218" y="469" font-size="9" fill="#57606a">Shared resource (confounding risk)</text>
  <rect x="400" y="458" width="12" height="12" rx="2" fill="#f0f6ff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="418" y="469" font-size="9" fill="#57606a">Internal microservice</text>

  <defs>
    <marker id="ta" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82d4"/>
    </marker>
  </defs>
</svg>
